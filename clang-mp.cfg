# Force C++ driver mode
--driver-mode=g++

# Match CMake's compile options
-nostdinc++
-isystem /opt/local/libexec/llvm-19/include/c++/v1
-isystem /opt/local/libexec/llvm-19/lib/clang/19/include
-I/opt/local/include
-I/opt/local/libexec/tbb/include/tbb

# Catalina runtime target
-mmacosx-version-min=10.15

# Disable SDK availability gating
-D_LIBCPP_DISABLE_AVAILABILITY

# Enable experimental libc++ features
-fexperimental-library
-fno-experimental-isel

# Match CMake's link search paths
-L/opt/local/libexec/llvm-19/lib
-L/opt/local/lib
-L/opt/local/libexec
-L/opt/local/libexec/tbb/lib
-L/opt/local/libexec/llvm-19/lib/libunwind
-L/usr/local/lib
-L/opt/local/libexec/llvm-19/lib/libc++

# Embed rpaths so @rpath/libc++.1.dylib resolves to MacPorts
-Wl,-rpath,/opt/local/libexec/llvm-19/lib
-Wl,-rpath,/opt/local/libexec/llvm-19/lib/libunwind
-Wl,-rpath,/opt/local/libexec/tbb/lib
-Wl,-rpath,/opt/local/libexec/llvm-19/lib/libc++

# Match CMake's link libraries
-lc++
/opt/local/libexec/llvm-19/lib/libc++/libc++experimental.a
-lunwind

